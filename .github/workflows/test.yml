name: test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2 # installs the tools pinned in mise.toml
      - run: npm ci
      - run: .local/bin/format --check # Gleam and Markdown
      - run: gleam deps download
      - run: gleam test
